<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LikesFF • Admin</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="bg"><header><a class="brand" href="shop.html">💜 Likes<b>FF</b></a><nav class="nav"><a href="shop.html" id="nshop">Likes</a><a href="wallet.html" id="nwallet">Add Money</a><a href="orders.html" id="norders">My Orders</a><a href="profile.html" id="nprofile">Profile</a><span class="wallet" id="balance">৳0</span><a href="#" onclick="logout()">Logout</a></nav></header><main class="container"><section class="layout"><section class="panel wide"><span class="tag">ADMIN PANEL</span><h2>Dashboard</h2><div id="admin"></div></section></section></main><footer class="footer">© LikesFF • Fast & Smooth Service</footer><div id="toast" class="toast"></div></div><script src="assets/app.js"></script><script>if(!protect()){}</script><script>if(!session().admin)location.href="index.html";function render(){let d=getDB();admin.innerHTML='<h3>Prices</h3>'+d.plans.map(p=>`<div class="row">${p.likes.toLocaleString()} Likes — <input class="input" style="max-width:170px;display:inline-block" id="p${p.id}" value="${p.price}"><button class="btn primary" onclick="price(${p.id})">Save</button></div>`).join("")+'<h3>Deposits</h3>'+(d.deposits.length?d.deposits.map(x=>{let u=d.users.find(q=>q.id===x.userId);return`<div class="row">#${x.id} ${u?.username||"user"} — ${money(x.amount)} — ${x.status} ${x.status==="pending"?`<button class="btn" onclick="dep(${x.id},'approved')">Approve</button> <button class="btn" onclick="dep(${x.id},'rejected')">Reject</button>`:""}</div>`}).join(""):'<div class="muted">No deposits</div>')+'<h3>Orders</h3>'+d.orders.map(x=>{let u=d.users.find(q=>q.id===x.userId),p=d.plans.find(q=>q.id===x.planId);return`<div class="row">#${x.id} ${u?.username} — ${p.likes} likes — ${x.status} <button class="btn" onclick="ord(${x.id})">Complete</button></div>`}).join("")}function price(id){let d=getDB();d.plans.find(x=>x.id===id).price=Number(document.getElementById("p"+id).value);saveDB(d);toast("Price updated");render()}function dep(id,status){let d=getDB(),x=d.deposits.find(q=>q.id===id);if(x.status!=="pending")return; x.status=status;if(status==="approved")d.users.find(q=>q.id===x.userId).balance+=x.amount;saveDB(d);render()}function ord(id){let d=getDB();d.orders.find(x=>x.id===id).status="completed";saveDB(d);render()}render()</script></body></html>
