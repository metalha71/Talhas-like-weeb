<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LikesFF • Add Money</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="bg"><header><a class="brand" href="shop.html">💜 Likes<b>FF</b></a><nav class="nav"><a href="shop.html" id="nshop">Likes</a><a href="wallet.html" id="nwallet">Add Money</a><a href="orders.html" id="norders">My Orders</a><a href="profile.html" id="nprofile">Profile</a><span class="wallet" id="balance">৳0</span><a href="#" onclick="logout()">Logout</a></nav></header><main class="container"><section class="layout"><section class="panel"><span class="tag">WALLET</span><h2>Add Money</h2><p class="muted">Payment Number: <b id="pay"></b></p><div class="chips"><button class="chip" onclick="a(100)">৳100</button><button class="chip" onclick="a(200)">৳200</button><button class="chip" onclick="a(500)">৳500</button><button class="chip" onclick="a(1000)">৳1000</button></div><input class="input" id="amount" type="number" min="1" placeholder="Enter any amount"><input class="input" id="trx" placeholder="Transaction ID"><button class="btn primary full" onclick="deposit()">Submit Deposit</button><h3>Deposit History</h3><div id="history"></div></section></section></main><footer class="footer">© LikesFF • Fast & Smooth Service</footer><div id="toast" class="toast"></div></div><script src="assets/app.js"></script><script>if(!protect()){}</script><script>let d=getDB();pay.textContent=d.settings.paymentNumber;function a(x){amount.value=x}function deposit(){let s=session(),v=Number(amount.value);if(v<1)return toast("Enter a valid amount");let d=getDB();d.deposits.unshift({id:Date.now(),userId:s.id,amount:v,trxId:trx.value,status:"pending",created:new Date().toLocaleString()});saveDB(d);toast("Deposit submitted for admin approval");load()}function load(){let s=session(),d=getDB(),x=d.deposits.filter(z=>z.userId===s.id);history.innerHTML=x.length?x.map(z=>`<div class="row">${money(z.amount)} • ${z.status} • ${z.created}</div>`).join(""):'<div class="muted">No deposits yet.</div>'}load();header()</script></body></html>
