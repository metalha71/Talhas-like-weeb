<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LikesFF • Login</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="bg authwrap"><section class="auth"><div class="logo">💜 Likes<b style="color:#b45cff">FF</b></div><h2>Welcome back</h2><p class="muted">Login to continue to your account.</p><input class="input" id="u" placeholder="Username"><input class="input" id="p" type="password" placeholder="Password"><button class="btn primary full" onclick="login()">Login</button><div class="switch">Don't have an account? <a href="register.html">Create account</a></div><div class="switch"><a href="#" onclick="admin()">Admin Login</a></div></section></div><script src="assets/app.js"></script><script>function login(){let d=getDB(),u=d.users.find(x=>x.username===uEl.value);if(!u||u.password!==pEl.value)return toast("Invalid username or password");setSession({id:u.id});location.href="shop.html"}let uEl=document.getElementById("u"),pEl=document.getElementById("p");function admin(){let pass=prompt("Admin password");if(pass==="zx"){setSession({admin:true});location.href="admin.html"}else toast("Invalid admin password")}</script><div id="toast" class="toast"></div></body></html>
