<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LikesFF • Likes</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="bg"><header><a class="brand" href="shop.html">💜 Likes<b>FF</b></a><nav class="nav"><a href="shop.html" id="nshop">Likes</a><a href="wallet.html" id="nwallet">Add Money</a><a href="orders.html" id="norders">My Orders</a><a href="profile.html" id="nprofile">Profile</a><span class="wallet" id="balance">৳0</span><a href="#" onclick="logout()">Logout</a></nav></header><main class="container"><section class="hero"><span class="tag">FREE FIRE LIKES SERVICE</span><h1>Boost your profile with <span style="color:#b45cff">Likes</span></h1><p>Choose your package and purchase using your wallet balance.</p></section><section class="grid" id="plans"></section></main><footer class="footer">© LikesFF • Fast & Smooth Service</footer><div id="toast" class="toast"></div></div><script src="assets/app.js"></script><script>if(!protect()){}</script><script>let d=getDB();document.getElementById("plans").innerHTML=d.plans.map(p=>`<article class="card"><div class="icon">${p.icon}</div><div class="likes">${p.likes.toLocaleString()} Likes</div><div class="muted">Delivery within ${p.days} days</div><div class="price"><span class="muted">ONE TIME</span><br><strong>${money(p.price)}</strong></div><button class="btn primary full" onclick="buy(${p.id})">Purchase Now →</button></article>`).join("");header();function buy(id){let d=getDB(),s=session(),u=d.users.find(x=>x.id===s.id),p=d.plans.find(x=>x.id===id);if(u.balance<p.price)return toast("Insufficient wallet balance");u.balance-=p.price;d.orders.unshift({id:Date.now(),userId:u.id,planId:id,price:p.price,status:"pending",created:new Date().toLocaleString()});saveDB(d);toast("Order placed successfully");setTimeout(()=>location.href="orders.html",600)}</script></body></html>
