<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LikesFF • Register</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="bg authwrap"><section class="auth"><div class="logo">💜 Likes<b style="color:#b45cff">FF</b></div><h2>Create account</h2><p class="muted">Register a new LikesFF account.</p><input class="input" id="u" placeholder="Username"><input class="input" id="p" type="password" placeholder="Password"><button class="btn primary full" onclick="reg()">Create Account</button><div class="switch">Already have an account? <a href="index.html">Login</a></div></section></div><script src="assets/app.js"></script><script>function reg(){let d=getDB(),u=document.getElementById("u").value.trim(),p=document.getElementById("p").value;if(u.length<3||p.length<4)return toast("Username 3+ and password 4+ required");if(d.users.some(x=>x.username===u))return toast("Username already exists");let id=Date.now();d.users.push({id,username:u,password:p,balance:0,created:new Date().toISOString()});saveDB(d);setSession({id});location.href="shop.html"}</script><div id="toast" class="toast"></div></body></html>
